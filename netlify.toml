# Despliegue en Netlify — sitio Astro estático
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Funciones serverless (inscripción de competidores → Airtable)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Redirección 301: el dominio de Netlify redirige al dominio definitivo
# (evita contenido duplicado; www→raíz ya lo gestiona Netlify automáticamente).
[[redirects]]
  from = "https://lanegraworld.netlify.app/*"
  to = "https://campeonatopasoslibres.com/:splat"
  status = 301
  force = true

# Restos de la web antigua en WordPress. El PDF de las bases de 2025 seguía
# indexado y compitiendo con la página actual: se manda a las bases vigentes.
[[redirects]]
  from = "/wp-content/uploads/*"
  to = "/bases-y-reglamento/"
  status = 301
  force = true

# El servidor de medios (IONOS) no procesa .htaccess, así que no hay manera de
# que mande la cabecera CORS. Sin ella el navegador no deja descargar una
# imagen de otro dominio. Esta regla la sirve A TRAVÉS de Netlify: para el
# navegador pasa a ser del mismo origen y la descarga funciona.
#
# Solo la usa el botón de descarga. Las imágenes que se ven en las páginas
# siguen pidiéndose directamente a media.lanegrasalsa.com, así que esto no
# añade tráfico de navegación, solo el de las descargas.
[[redirects]]
  from = "/medios/*"
  to = "https://media.lanegrasalsa.com/:splat"
  status = 200
  force = true

# Rutas antiguas que cambiaron de nombre. Antes eran páginas con <meta refresh>,
# que es más lento y Google trata como redirección "blanda": mejor un 301 de verdad.
[[redirects]]
  from = "/talleres/*"
  to = "/programacion-2026/"
  status = 301
  force = true

[[redirects]]
  from = "/en/workshops/*"
  to = "/en/programme-2026/"
  status = 301
  force = true

[[redirects]]
  from = "/it/workshops/*"
  to = "/it/programma-2026/"
  status = 301
  force = true

[[redirects]]
  from = "/programacion/*"
  to = "/programacion-2026/"
  status = 301
  force = true

[[redirects]]
  from = "/en/schedule/*"
  to = "/en/programme-2026/"
  status = 301
  force = true

[[redirects]]
  from = "/it/programma/*"
  to = "/it/programma-2026/"
  status = 301
  force = true

# 404 por idioma. Astro genera los tres (src/pages/404.astro y los de en/ e it/);
# estas reglas hacen que una URL rota bajo /en/ o /it/ devuelva la suya, con su
# menú y su texto, en vez de la española. Van al final: Netlify aplica la
# primera regla que casa, así que cualquier redirección real tiene prioridad.
[[redirects]]
  from = "/en/*"
  to = "/en/404/index.html"
  status = 404

[[redirects]]
  from = "/it/*"
  to = "/it/404/index.html"
  status = 404
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
